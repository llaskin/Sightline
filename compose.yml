# Local development and test database for the Sightline.
# Ports are deliberately non-default (5433) so this stack cannot collide with
# another PostgreSQL already bound to 5432 on the host.
#
#   Start:  docker compose up -d
#   Stop:   docker compose down
#   Reset:  docker compose down -v      (destroys the named volume)
services:
  db:
    image: postgres:16-alpine
    container_name: sightline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: excuse
      POSTGRES_PASSWORD: sightline_local_dev
      POSTGRES_DB: sightline
    ports:
      # Bound to loopback deliberately. Docker's short form ('5433:5432')
      # publishes on every interface, so the database would accept connections
      # from anyone on the same network -- using the password a few lines above,
      # which is in a public repository. Local development does not need that.
      - '127.0.0.1:5433:5432'
    volumes:
      - sightline-pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U excuse -d sightline']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sightline-pgdata:
    name: sightline-pgdata
